spring.application.name=autoloc-api

# Connexion MySQL (la base autoloc_db se créera toute seule)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.context-path=/api
server.port=8081

logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO